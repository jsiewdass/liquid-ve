# liquidVE — SDD configuration.
# Generated by sdd-init on 2026-11-23. Update when conventions or tooling change.

schema: spec-driven

project:
  name: liquidVE
  description: Binance P2P (USDT/VES) automation engine for the Venezuelan banking ecosystem.

persistence:
  mode: openspec

strict_tdd: true

context: |
  Backend for Binance P2P USDT/VES automation: FastAPI + async SQLAlchemy 2.0 (aiosqlite, PostgreSQL-ready) + Alembic.
  Layered layout: app/{core,domain,infrastructure,services,api}; external providers isolated in app/infrastructure/clients.
  Money is Decimal/Numeric only. order_number and bank_reference are UNIQUE idempotency anchors persisted before side effects.
  Order lifecycle is a strict state machine (OrderStatus.ALLOWED_TRANSITIONS) with an append-only AuditLog.
  Providers: Binance C2C API, Cachicamo Cash (HMAC webhooks), Android SMS gateway over Tailscale, optional Playwright.
  Config is pydantic-settings with fail-fast production validation; loguru structured logs mask secrets and PII.
  Tests: pytest + pytest-asyncio (asyncio_mode=auto), respx + freezegun; the suite never touches the network.
  Authoritative product spec: PROJECT_SPEC.md at the repo root (local-only file, gitignored).

rules:
  proposal:
    - State the risk impact for any change touching money movement, limits, or idempotency anchors
    - Include a rollback plan when the change alters persisted schema or order state transitions
  specs:
    - Use Given/When/Then for scenarios
    - Use RFC 2119 keywords (MUST, SHALL, SHOULD, MAY)
    - Every requirement touching payments MUST declare its idempotency and audit behavior
  design:
    - Document transaction boundaries and which side effects are idempotent
    - Include sequence diagrams for buy, sell and webhook flows
    - Keep third-party access behind an adapter under app/infrastructure/clients
    - Money values MUST remain Decimal; floats are forbidden
  tasks:
    - Group by phase, use hierarchical numbering
    - Keep each task completable in one session
  apply:
    guidelines:
      - "Follow existing patterns: `from __future__ import annotations`, module and Google-style docstrings"
      - Reuse app/core/exceptions.py typed errors rather than raising bare exceptions
      - Persist idempotency anchors and audit entries before calling non-idempotent providers
    tdd: true
    test_command: "python -m pytest -q"
  verify:
    test_command: "python -m pytest -q"
    lint_command: "python -m ruff check app tests"
    typecheck_command: "python -m mypy app"
    coverage_threshold: 0
  archive:
    - Warn before merging destructive deltas
    - Never modify an archived change folder

testing:
  detected: 2026-11-23
  strict_tdd: true
  runner:
    framework: pytest
    command: "python -m pytest -q"
    config: pytest.ini
    notes: "asyncio_mode=auto; async tests need no marker"
  layers:
    unit:
      available: true
      tool: "pytest + pytest-asyncio"
    integration:
      available: true
      tool: "httpx.AsyncClient + ASGITransport, respx, in-memory SQLite via StaticPool"
    e2e:
      available: false
      tool: null
  coverage:
    available: true
    command: "python -m pytest --cov=app --cov-report=term-missing"
  quality:
    linter:
      available: true
      command: "python -m ruff check app tests"
      status: "clean"
    type_checker:
      available: true
      command: "python -m mypy app"
      status: "available; no mypy config yet and 30 pre-existing errors"
    formatter:
      available: true
      command: "python -m ruff format app tests"
      status: "available; not applied to the current tree"
